# Settings shared by the api and worker services (one Dockerfile, two containers).
x-app: &app
  build: .
  image: pipelinedoctor-app
  env_file: .env
  environment:               # these override .env, because inside Docker the hosts have different names
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432      # the container port; POSTGRES_PORT in .env is only the port on your PC
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app                 # live code: edits on your PC appear inside the container
    - hf_cache:/hf_cache     # keeps the downloaded embedding model between restarts
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pd_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pd_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    container_name: pd_api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    container_name: pd_worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2

  frontend:
    image: nginx:alpine
    container_name: pd_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro            # the page: edit and refresh, no rebuild
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  hf_cache:
