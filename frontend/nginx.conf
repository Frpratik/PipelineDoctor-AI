server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No caching while developing, so edits show up on refresh.
    add_header Cache-Control "no-store";

    # The browser talks only to this server; /api/... is forwarded to the FastAPI container.
    # That avoids CORS, because the page and the API share one origin.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
